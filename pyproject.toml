[project]
name = "spine"
version = "0.1.0"
description = "Evaluation, temporal splitting and decision logic shared by the MAIB Term 4 projects."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Krishna Mathur" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pyyaml>=6",
    # read_table advertises Parquet, and data/processed is Parquet by convention.
    "pyarrow>=16",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "hypothesis>=6",
    "utilsforecast>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spine"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "D"]
# D203/D213: conflict with the numpy convention selected below.
# D401: a metric's summary line should name the quantity it returns
#       ("Expected Calibration Error."), not command the reader.
ignore = ["D203", "D213", "D401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103"]
"scripts/*" = ["D103"]
"docs/build.py" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
# src/spine is a testpath so that the worked example in every docstring is executed
# as a doctest. An example that drifts from the code fails the suite.
testpaths = ["tests", "src/spine"]
addopts = "-q --cov=spine --cov-report=term-missing --doctest-modules"

[tool.coverage.run]
source = ["spine"]
